      rel="stylesheet"
    />
    <script>
      // El diseño se maqueta a 1920px y se escala al ancho real (1366 o 1920).
      // Se ejecuta antes del primer pintado para evitar un salto de escala.
      ;(function () {
        var root = document.documentElement
        function ajustar() {
          root.style.setProperty('--zoom', String(root.clientWidth / 1920))
        }
        ajustar()
        new ResizeObserver(ajustar).observe(root)
      })()
    </script>
